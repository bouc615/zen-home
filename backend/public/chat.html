<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天测试 - ZenHome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .message.assistant .message-bubble {
      background: white;
      color: #333;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .message.system .message-bubble {
      background: #fff3cd;
      color: #856404;
      max-width: 100%;
      text-align: center;
      font-size: 14px;
    }

    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    #messageInput:focus {
      border-color: #667eea;
    }

    #sendButton {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #sendButton:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #667eea;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .error {
      background: #f8d7da !important;
      color: #721c24 !important;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🤖 AI 聊天测试</h1>
      <p>ZenHome 智能厨房管家</p>
    </div>

    <div class="messages" id="messages">
      <div class="message system">
        <div class="message-bubble">
          你好！我是你的厨房管家。我可以帮你规划食谱、管理食材。今天想吃点什么？
        </div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off" />
      <button id="sendButton">发送</button>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3000/api';
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    let chatHistory = [];
    let isLoading = false;

    // 添加消息到界面
    function addMessage(role, text) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'message-bubble';
      bubbleDiv.textContent = text;

      messageDiv.appendChild(bubbleDiv);
      messagesContainer.appendChild(messageDiv);

      // 滚动到底部
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 显示加载状态
    function showLoading() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';
      messageDiv.id = 'loading-message';

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'message-bubble';
      bubbleDiv.innerHTML = '<span class="loading"></span> <span class="loading"></span> <span class="loading"></span>';

      messageDiv.appendChild(bubbleDiv);
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 移除加载状态
    function hideLoading() {
      const loadingMessage = document.getElementById('loading-message');
      if (loadingMessage) {
        loadingMessage.remove();
      }
    }

    // 发送消息
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message || isLoading) return;

      // 添加用户消息
      addMessage('user', message);
      chatHistory.push({ role: 'user', text: message });

      // 清空输入框
      messageInput.value = '';

      // 禁用发送按钮
      isLoading = true;
      sendButton.disabled = true;
      showLoading();

      try {
        const response = await fetch(`${API_BASE_URL}/ai/chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            history: chatHistory,
            message: message,
            inventory: [],
            recipes: [],
          }),
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        hideLoading();

        // 添加 AI 回复
        addMessage('assistant', data.text);
        chatHistory.push({ role: 'model', text: data.text });

      } catch (error) {
        hideLoading();
        console.error('Error:', error);

        const errorDiv = document.createElement('div');
        errorDiv.className = 'message assistant';
        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'message-bubble error';
        bubbleDiv.textContent = '抱歉，发生了错误：' + error.message;
        errorDiv.appendChild(bubbleDiv);
        messagesContainer.appendChild(errorDiv);
      } finally {
        isLoading = false;
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    // 事件监听
    sendButton.addEventListener('click', sendMessage);

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // 自动聚焦输入框
    messageInput.focus();
  </script>
</body>

</html>
